name: OpenSSF Scorecard

# Runs the Scorecard analysis over this repository on a schedule and on every change to `main`, so a
# regression in the pipeline (a moving tag, a widened `permissions:`) shows up as a dropped score
# instead of a surprise. `publish_results` is disabled: see the note below and CONTRIBUTING.md.

on:
  schedule:
    # Sunday 06:00 Europe/Istanbul, the same slot as the Dependabot week
    - cron: '0 6 * * 0'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Scorecard reads past workflow runs, issues and pull requests to score the pipeline itself
      actions: read
      issues: read
      pull-requests: read
      checks: read

    steps:
      # `fetch-depth: 0` and `persist-credentials: false`: Scorecard needs the commit history to check
      # code review, and the analysis never needs to write with the token
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # `publish_results: false` keeps this run self-contained. Publishing would need `id-token: write`
      # and `security-events: write`, would replace the OpenSSF team's weekly scan of this repository
      # with ours, and is the maintainer's call rather than a pull request's (`attestations`/`id-token`
      # grants). The README badge points at the published results, so there is no badge until that
      # switch is made — CONTRIBUTING.md → CI and supply chain has the two-line change.
      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 14
          if-no-files-found: warn
