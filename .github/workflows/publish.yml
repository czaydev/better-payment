name: Publish to NPM

# Runs on every push to main and beta and publishes when packages/better-payment/package.json has a
# version that has no GitHub release yet (that is, right after the release PR is merged). Other
# pushes skip the publish job. main publishes on the npm "latest" tag; beta, which is in changesets
# pre mode, publishes prereleases on the "beta" tag. It can also be run by hand, for a dry run or
# another npm dist-tag.

on:
  push:
    branches: [main, beta]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not actually publish)'
        required: false
        default: 'false'
        type: boolean
      npm_tag:
        description: 'npm dist-tag (empty: "beta" for a prerelease version, else "latest"; an explicit tag is required to publish a version lower than the current latest)'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# A release publishes to npm, so it is the one workflow that must not widen its token: every job
# states what it needs and nothing else
permissions:
  contents: read

jobs:
  check:
    name: Is there an unreleased version?
    if: github.repository == 'czaydev/better-payment'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      unreleased: ${{ steps.check.outputs.unreleased }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Look for the version's GitHub release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./packages/better-payment/package.json').version")"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG is already released"
            echo "unreleased=false" >> "$GITHUB_OUTPUT"
          else
            echo "$TAG has no release yet"
            echo "unreleased=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check
    # By hand it always runs (the release check below stops a real publish of a released version)
    if: github.event_name == 'workflow_dispatch' || needs.check.outputs.unreleased == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Pushes have no inputs: publish for real, on the tag the version picks (see "Read version")
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run == true || inputs.dry_run == 'true') }}

    permissions:
      contents: write # create the version tag and GitHub release
      id-token: write # npm trusted publishing

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      # Trusted publishing (OIDC) needs npm >= 11.5.1; no NPM_TOKEN is used
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read version and release notes
        id: release
        working-directory: packages/better-payment
        env:
          NPM_TAG_INPUT: ${{ inputs.npm_tag }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # A prerelease (0.12.0-beta.0) never becomes "latest"
          case "$VERSION" in *-*) DEFAULT_TAG=beta ;; *) DEFAULT_TAG=latest ;; esac
          # beta publishes prereleases only: a stable version there means pre mode is off
          if [ "$GITHUB_REF_NAME" = "beta" ] && [ "$DEFAULT_TAG" = "latest" ] && [ -z "$NPM_TAG_INPUT" ]; then
            echo "::error::beta has the stable version $VERSION; run 'pnpm changeset pre enter beta' on beta (CONTRIBUTING.md → Beta releases)"
            exit 1
          fi
          echo "NPM_TAG=${NPM_TAG_INPUT:-$DEFAULT_TAG}" >> "$GITHUB_ENV"
          # The "## <version>" section of CHANGELOG.md becomes the release notes
          awk -v v="## $VERSION" '$0 == v {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "::error::CHANGELOG.md has no '## $VERSION' section"
            exit 1
          fi
          # The docs changelog is written by hand in the release PR; do not publish without it
          for page in changelog.mdx changelog.tr.mdx; do
            if ! grep -qx "## $VERSION" "../../apps/web/content/docs/reference/$page"; then
              echo "::error::apps/web/content/docs/reference/$page has no '## $VERSION' section; add the release notes (en/tr) before publishing"
              exit 1
            fi
          done

      - name: Check the release does not exist yet
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.release.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::Release $TAG already exists; bump the version first"
            exit 1
          fi

      - name: Lint, typecheck and test
        working-directory: packages/better-payment
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Build package
        working-directory: packages/better-payment
        run: pnpm build

      # --provenance makes a missing SLSA attestation fail the release instead of publishing silently
      - name: Publish to NPM
        if: env.DRY_RUN != 'true'
        working-directory: packages/better-payment
        run: npm publish --access public --tag "$NPM_TAG" --provenance

      - name: Dry run publish
        if: env.DRY_RUN == 'true'
        working-directory: packages/better-payment
        run: npm publish --access public --tag "$NPM_TAG" --dry-run

      - name: Create GitHub release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.release.outputs.version }}
        run: |
          # Only releases on the npm "latest" tag become GitHub's latest release
          if [ "$NPM_TAG" = "latest" ]; then FLAGS="--latest"; else FLAGS="--prerelease --latest=false"; fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" $FLAGS

      - name: Show release notes (dry run)
        if: env.DRY_RUN == 'true'
        run: cat "$RUNNER_TEMP/release-notes.md"
