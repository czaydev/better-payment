name: Sandbox

# Runs the package against the providers' real test environments.
# Each provider suite is skipped when its secrets are not set.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      record:
        description: 'Save redacted provider responses as a build artifact'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sandbox
  cancel-in-progress: false

jobs:
  sandbox:
    name: Provider sandboxes
    if: github.repository == 'czaydev/better-payment'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: packages/better-payment

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Run sandbox tests
        run: pnpm test:sandbox
        env:
          SANDBOX_RECORD: ${{ inputs.record && '1' || '' }}
          IYZICO_SANDBOX_API_KEY: ${{ secrets.IYZICO_SANDBOX_API_KEY || secrets.IYZICO_API_KEY }}
          IYZICO_SANDBOX_SECRET_KEY: ${{ secrets.IYZICO_SANDBOX_SECRET_KEY || secrets.IYZICO_SECRET_KEY }}
          PAYTR_SANDBOX_MERCHANT_ID: ${{ secrets.PAYTR_SANDBOX_MERCHANT_ID }}
          PAYTR_SANDBOX_MERCHANT_KEY: ${{ secrets.PAYTR_SANDBOX_MERCHANT_KEY }}
          PAYTR_SANDBOX_MERCHANT_SALT: ${{ secrets.PAYTR_SANDBOX_MERCHANT_SALT }}
          PARAMPOS_SANDBOX_CLIENT_CODE: ${{ secrets.PARAMPOS_SANDBOX_CLIENT_CODE }}
          PARAMPOS_SANDBOX_CLIENT_USERNAME: ${{ secrets.PARAMPOS_SANDBOX_CLIENT_USERNAME }}
          PARAMPOS_SANDBOX_CLIENT_PASSWORD: ${{ secrets.PARAMPOS_SANDBOX_CLIENT_PASSWORD }}
          PARAMPOS_SANDBOX_GUID: ${{ secrets.PARAMPOS_SANDBOX_GUID }}
          PARAMPOS_SANDBOX_CARD_NUMBER: ${{ secrets.PARAMPOS_SANDBOX_CARD_NUMBER }}
          PARAMPOS_SANDBOX_CARD_EXPIRE_MONTH: ${{ secrets.PARAMPOS_SANDBOX_CARD_EXPIRE_MONTH }}
          PARAMPOS_SANDBOX_CARD_EXPIRE_YEAR: ${{ secrets.PARAMPOS_SANDBOX_CARD_EXPIRE_YEAR }}
          PARAMPOS_SANDBOX_CARD_CVC: ${{ secrets.PARAMPOS_SANDBOX_CARD_CVC }}
          AKBANK_SANDBOX_MERCHANT_SAFE_ID: ${{ secrets.AKBANK_SANDBOX_MERCHANT_SAFE_ID }}
          AKBANK_SANDBOX_TERMINAL_SAFE_ID: ${{ secrets.AKBANK_SANDBOX_TERMINAL_SAFE_ID }}
          AKBANK_SANDBOX_SECRET_KEY: ${{ secrets.AKBANK_SANDBOX_SECRET_KEY }}
          AKBANK_SANDBOX_CARD_NUMBER: ${{ secrets.AKBANK_SANDBOX_CARD_NUMBER }}
          AKBANK_SANDBOX_CARD_EXPIRE_MONTH: ${{ secrets.AKBANK_SANDBOX_CARD_EXPIRE_MONTH }}
          AKBANK_SANDBOX_CARD_EXPIRE_YEAR: ${{ secrets.AKBANK_SANDBOX_CARD_EXPIRE_YEAR }}
          AKBANK_SANDBOX_CARD_CVC: ${{ secrets.AKBANK_SANDBOX_CARD_CVC }}
          SIPAY_SANDBOX_APP_ID: ${{ secrets.SIPAY_SANDBOX_APP_ID }}
          SIPAY_SANDBOX_APP_SECRET: ${{ secrets.SIPAY_SANDBOX_APP_SECRET }}
          SIPAY_SANDBOX_MERCHANT_KEY: ${{ secrets.SIPAY_SANDBOX_MERCHANT_KEY }}
          QNBPAY_SANDBOX_APP_ID: ${{ secrets.QNBPAY_SANDBOX_APP_ID }}
          QNBPAY_SANDBOX_APP_SECRET: ${{ secrets.QNBPAY_SANDBOX_APP_SECRET }}
          QNBPAY_SANDBOX_MERCHANT_KEY: ${{ secrets.QNBPAY_SANDBOX_MERCHANT_KEY }}
          QNBPAY_SANDBOX_CARD_NUMBER: ${{ secrets.QNBPAY_SANDBOX_CARD_NUMBER }}
          QNBPAY_SANDBOX_CARD_EXPIRE_MONTH: ${{ secrets.QNBPAY_SANDBOX_CARD_EXPIRE_MONTH }}
          QNBPAY_SANDBOX_CARD_EXPIRE_YEAR: ${{ secrets.QNBPAY_SANDBOX_CARD_EXPIRE_YEAR }}
          QNBPAY_SANDBOX_CARD_CVC: ${{ secrets.QNBPAY_SANDBOX_CARD_CVC }}
          TOSLA_SANDBOX_CLIENT_ID: ${{ secrets.TOSLA_SANDBOX_CLIENT_ID }}
          TOSLA_SANDBOX_API_USER: ${{ secrets.TOSLA_SANDBOX_API_USER }}
          TOSLA_SANDBOX_API_PASS: ${{ secrets.TOSLA_SANDBOX_API_PASS }}
          TOSLA_SANDBOX_CARD_NUMBER: ${{ secrets.TOSLA_SANDBOX_CARD_NUMBER }}
          TOSLA_SANDBOX_CARD_EXPIRE_MONTH: ${{ secrets.TOSLA_SANDBOX_CARD_EXPIRE_MONTH }}
          TOSLA_SANDBOX_CARD_EXPIRE_YEAR: ${{ secrets.TOSLA_SANDBOX_CARD_EXPIRE_YEAR }}
          TOSLA_SANDBOX_CARD_CVC: ${{ secrets.TOSLA_SANDBOX_CARD_CVC }}
          EST_SANDBOX_CLIENT_ID: ${{ secrets.EST_SANDBOX_CLIENT_ID }}
          EST_SANDBOX_USERNAME: ${{ secrets.EST_SANDBOX_USERNAME }}
          EST_SANDBOX_PASSWORD: ${{ secrets.EST_SANDBOX_PASSWORD }}
          EST_SANDBOX_STORE_KEY: ${{ secrets.EST_SANDBOX_STORE_KEY }}
          EST_SANDBOX_CARD_NUMBER: ${{ secrets.EST_SANDBOX_CARD_NUMBER }}
          EST_SANDBOX_CARD_EXPIRE_MONTH: ${{ secrets.EST_SANDBOX_CARD_EXPIRE_MONTH }}
          EST_SANDBOX_CARD_EXPIRE_YEAR: ${{ secrets.EST_SANDBOX_CARD_EXPIRE_YEAR }}
          EST_SANDBOX_CARD_CVC: ${{ secrets.EST_SANDBOX_CARD_CVC }}
          ALBARAKA_SANDBOX_MERCHANT_ID: ${{ secrets.ALBARAKA_SANDBOX_MERCHANT_ID }}
          ALBARAKA_SANDBOX_TERMINAL_ID: ${{ secrets.ALBARAKA_SANDBOX_TERMINAL_ID }}
          ALBARAKA_SANDBOX_POSNET_ID: ${{ secrets.ALBARAKA_SANDBOX_POSNET_ID }}
          ALBARAKA_SANDBOX_ENC_KEY: ${{ secrets.ALBARAKA_SANDBOX_ENC_KEY }}
          ALBARAKA_SANDBOX_CARD_NUMBER: ${{ secrets.ALBARAKA_SANDBOX_CARD_NUMBER }}
          ALBARAKA_SANDBOX_CARD_EXPIRE_MONTH: ${{ secrets.ALBARAKA_SANDBOX_CARD_EXPIRE_MONTH }}
          ALBARAKA_SANDBOX_CARD_EXPIRE_YEAR: ${{ secrets.ALBARAKA_SANDBOX_CARD_EXPIRE_YEAR }}
          ALBARAKA_SANDBOX_CARD_CVC: ${{ secrets.ALBARAKA_SANDBOX_CARD_CVC }}
          QNB_SANDBOX_MERCHANT_ID: ${{ secrets.QNB_SANDBOX_MERCHANT_ID }}
          QNB_SANDBOX_USER_CODE: ${{ secrets.QNB_SANDBOX_USER_CODE }}
          QNB_SANDBOX_USER_PASS: ${{ secrets.QNB_SANDBOX_USER_PASS }}
          QNB_SANDBOX_MERCHANT_PASS: ${{ secrets.QNB_SANDBOX_MERCHANT_PASS }}
          QNB_SANDBOX_CARD_NUMBER: ${{ secrets.QNB_SANDBOX_CARD_NUMBER }}
          QNB_SANDBOX_CARD_EXPIRE_MONTH: ${{ secrets.QNB_SANDBOX_CARD_EXPIRE_MONTH }}
          QNB_SANDBOX_CARD_EXPIRE_YEAR: ${{ secrets.QNB_SANDBOX_CARD_EXPIRE_YEAR }}
          QNB_SANDBOX_CARD_CVC: ${{ secrets.QNB_SANDBOX_CARD_CVC }}

      - name: Upload recorded responses
        if: ${{ inputs.record && always() }}
        uses: actions/upload-artifact@v7
        with:
          name: sandbox-recordings
          path: packages/better-payment/tests/fixtures/recorded/
          if-no-files-found: ignore
