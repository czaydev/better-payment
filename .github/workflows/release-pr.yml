name: Release PR

# Opens and updates the "chore(release): version packages" pull request whenever changesets land
# on main. Merging it publishes the release: publish.yml runs on the push to main (npm trusted
# publishing).
#
# Pull requests opened with the default GITHUB_TOKEN do not trigger other workflows, so CI does
# not run on the release PR. Add a fine-grained token with "Contents" and "Pull requests" write
# access as the RELEASE_PR_TOKEN secret to get CI on it.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release-pr:
    name: Open or update the release PR
    if: github.repository == 'czaydev/better-payment'
    runs-on: ubuntu-latest

    permissions:
      contents: write # push the changeset-release/main branch
      pull-requests: write # open and update the release PR

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # changesets reads git history

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Open or update the release PR
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          title: 'chore(release): version packages'
          commit: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
