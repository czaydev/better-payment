name: CI

on:
  push:
    branches: [main, beta]
  pull_request:

permissions:
  contents: read

jobs:
  docs-translations:
    name: Docs translations (en/tr)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Every docs page exists in English and Turkish, with the same code and headings
        run: node apps/web/scripts/check-translations.mjs

      - name: Every changeset has a docs changelog entry (en/tr)
        run: node scripts/check-changesets.mjs

      # A beta reaches main only after `changeset pre exit` (CONTRIBUTING.md → Beta releases)
      - name: main is not in prerelease mode
        if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
        run: |
          if [ "$(node -p "require('fs').existsSync('.changeset/pre.json') && require('./.changeset/pre.json').mode")" = "pre" ]; then
            echo "::error::.changeset/pre.json is in pre mode; run 'pnpm changeset pre exit' on beta before merging it into main"
            exit 1
          fi

  web-docs:
    name: Generated docs and web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter better-payment build
      - run: pnpm --filter web lint
      - run: pnpm --filter web docs:test
      - name: Provider tabs keyboard navigation tests
        run: pnpm --filter web tabs:test
      - name: Roadmap scroll regression tests
        run: node --test apps/web/scripts/roadmap-scroll.test.mjs
      - run: pnpm --filter web build
      - run: pnpm --filter web docs:check
      - name: Generate and check beta documentation URLs
        env:
          NEXT_PUBLIC_BASE_PATH: /beta
        run: |
          pnpm --filter web docs:generate
          pnpm --filter web docs:check

  package:
    name: better-payment (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22, 24]

    defaults:
      run:
        working-directory: packages/better-payment

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck examples
        run: pnpm typecheck:examples

      - name: Test (with coverage thresholds)
        run: pnpm test:coverage

      - name: Test (edge-runtime globals)
        run: pnpm test:edge

      - name: Build
        run: pnpm build

      - name: Bundle size
        run: pnpm size

      - name: Smoke test the built bundles
        run: |
          node -e "const bp = require('./dist/index.js'); if (!bp.VERSION || new bp.ValidationError('x').name !== 'ValidationError') process.exit(1)"
          node --input-type=module -e "import { VERSION } from './dist/index.mjs'; import { PaymentStatus } from './dist/client/index.mjs'; if (!VERSION || PaymentStatus.SUCCESS !== 'success') process.exit(1)"
          # better-payment/testing must share classes with the main entry (instanceof checks)
          node -e "const { MockProvider } = require('better-payment/testing'); const { PaymentProvider } = require('better-payment'); if (!(new MockProvider() instanceof PaymentProvider)) process.exit(1)"
          node --input-type=module -e "import { MockProvider } from 'better-payment/testing'; import { PaymentProvider } from 'better-payment'; if (!(new MockProvider() instanceof PaymentProvider)) process.exit(1)"
          # better-payment/plugins: a plugin works with the main entry (shared classes)
          node -e "const { localizedErrors } = require('better-payment/plugins'); const bp = require('better-payment'); try { localizedErrors({ locale: 'xx' }); process.exit(1) } catch (e) { if (!(e instanceof bp.ConfigurationError)) process.exit(1) }"
          node --input-type=module -e "import { localizedErrors } from 'better-payment/plugins'; import { betterPayment } from 'better-payment'; const p = betterPayment({ providers: {}, plugins: [localizedErrors({ locale: 'tr' })] }); if (!p.errors.message('INSUFFICIENT_FUNDS').startsWith('Kart')) process.exit(1)"
          # better-payment/fraud: the fraud rules engine ships as its own subpath
          node -e "const { fraudRules, MemoryFraudStore } = require('better-payment/fraud'); const bp = require('better-payment'); if (typeof fraudRules !== 'function' || typeof MemoryFraudStore !== 'function') process.exit(1); try { fraudRules({ operations: ['completeThreeDSPayment'] }); process.exit(1) } catch (e) { if (!(e instanceof bp.ConfigurationError)) process.exit(1) }"
          node --input-type=module -e "import { fraudRules } from 'better-payment/fraud'; if (typeof fraudRules !== 'function') process.exit(1)"
          # importing better-payment/plugins must not pull the fraud rules engine
          node -e "const p = require('better-payment/plugins'); if ('fraudRules' in p || 'MemoryFraudStore' in p) process.exit(1)"
          # better-payment/commission-router is its own subpath, not part of the plugins barrel
          node -e "const plugins = require('better-payment/plugins'); if ('commissionRouter' in plugins) process.exit(1); const { commissionRouter } = require('better-payment/commission-router'); const bp = require('better-payment'); try { commissionRouter({ rates: [{ provider: 'x', rate: '101' }] }); process.exit(1) } catch (e) { if (!(e instanceof bp.ConfigurationError)) process.exit(1) }"
          node --input-type=module -e "import { commissionRouter } from 'better-payment/commission-router'; import { betterPayment } from 'better-payment'; import { MockProvider } from 'better-payment/testing'; const p = betterPayment({ providers: { mock: new MockProvider() }, plugins: [commissionRouter({ rates: [{ provider: 'mock', rate: '1.00' }] })] }); const q = await p.router.quote({ price: '10.00' }); if (q.selected !== 'mock' || q.candidates[0].cost !== '0.10') process.exit(1)"
          # better-payment/routing is its own subpath, not part of the plugins barrel
          node -e "const plugins = require('better-payment/plugins'); if ('routing' in plugins) process.exit(1); const { routing } = require('better-payment/routing'); const bp = require('better-payment'); try { routing({ rules: [{ use: 'x', when: { cardType: 'prepaid' } }] }); process.exit(1) } catch (e) { if (!(e instanceof bp.ConfigurationError)) process.exit(1) }"
          node --input-type=module -e "import { routing } from 'better-payment/routing'; import { betterPayment } from 'better-payment'; import { MockProvider } from 'better-payment/testing'; const p = betterPayment({ providers: { mock: new MockProvider() }, defaultProvider: 'mock', plugins: [routing({ default: 'mock' })] }); const d = await p.routing.explain({ price: '10.00', currency: 'TRY' }); if (d.provider !== 'mock' || d.reason !== 'default') process.exit(1)"

      - name: Smoke test framework adapter subpaths (CJS and ESM)
        run: |
          # Resolve by package name so a missing exports mapping fails, even if dist exists.
          for entry in next:toNextJsHandler express:toExpressHandler hono:toHonoHandler fastify:toFastifyPlugin elysia:toElysiaHandler react-router:toReactRouterHandler; do
            adapter="${entry%%:*}"
            handler="${entry#*:}"
            node -e "const assert = require('node:assert/strict'); const path = 'better-payment/' + process.argv[1]; assert.equal(typeof require(path)[process.argv[2]], 'function', path + ' CJS handler export')" "$adapter" "$handler"
            node --input-type=module -e "import assert from 'node:assert/strict'; const path = 'better-payment/' + process.argv[1]; assert.equal(typeof (await import(path))[process.argv[2]], 'function', path + ' ESM handler export')" "$adapter" "$handler"
          done

      - name: Edge runtime smoke test (built bundle in the Vercel Edge VM)
        run: pnpm test:edge-smoke

      - name: No runtime dependencies
        run: node -e "const d = require('./package.json').dependencies || {}; if (Object.keys(d).length) { console.error('Runtime dependencies are not allowed:', d); process.exit(1) }"

      - name: Check package contents
        run: |
          test -f dist/index.js && test -f dist/index.mjs && test -f dist/index.d.ts
          test -f dist/client/index.js && test -f dist/client/index.d.ts
          test -f dist/testing/index.js && test -f dist/testing/index.mjs && test -f dist/testing/index.d.ts
          test -f dist/plugins/index.js && test -f dist/plugins/index.mjs && test -f dist/plugins/index.d.ts
          test -f dist/fraud/index.js && test -f dist/fraud/index.mjs && test -f dist/fraud/index.d.ts
          test -f dist/commission-router/index.js && test -f dist/commission-router/index.mjs && test -f dist/commission-router/index.d.ts
          test -f dist/routing/index.js && test -f dist/routing/index.mjs && test -f dist/routing/index.d.ts
          for adapter in next express hono fastify elysia react-router; do
            for extension in js mjs d.ts; do
              test -f "dist/$adapter/index.$extension"
            done
          done
          npm pack --dry-run

  next-shop:
    name: next-shop example (Playwright)
    # ubuntu-latest moved to 26.04, which Playwright cannot install chromium on yet.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # The example imports the workspace package's built `exports`, so build it first.
      - run: pnpm --filter better-payment build
      - run: pnpm --filter next-shop exec playwright install --with-deps chromium
      # Playwright's webServer runs the example's own `dev` script, which also
      # proves `prisma generate` and `prisma db push` work on a clean checkout.
      - run: pnpm --filter next-shop test:e2e

  cli:
    name: better-payment-cli
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/cli

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Build the library (the CLI links it as a workspace dependency)
        run: pnpm --filter better-payment build
        working-directory: .

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Smoke test the built CLI
        run: |
          node dist/bin.js --version
          node dist/bin.js --help
          node dist/bin.js init --help
          node dist/bin.js doctor --help
          node dist/bin.js listen --help
          node dist/bin.js nope 2>&1 | grep -q "unknown command"
