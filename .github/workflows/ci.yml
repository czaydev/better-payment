name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs-translations:
    name: Docs translations (en/tr)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Every docs page exists in English and Turkish, with the same code and headings
        run: node apps/web/scripts/check-translations.mjs

      - name: Every changeset has a docs changelog entry (en/tr)
        run: node scripts/check-changesets.mjs

  package:
    name: better-payment (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22, 24]

    defaults:
      run:
        working-directory: packages/better-payment

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck examples
        run: pnpm typecheck:examples

      - name: Test (with coverage thresholds)
        run: pnpm test:coverage

      - name: Test (edge-runtime globals)
        run: pnpm test:edge

      - name: Build
        run: pnpm build

      - name: Bundle size
        run: pnpm size

      - name: Smoke test the built bundles
        run: |
          node -e "const bp = require('./dist/index.js'); if (!bp.VERSION || new bp.ValidationError('x').name !== 'ValidationError') process.exit(1)"
          node --input-type=module -e "import { VERSION } from './dist/index.mjs'; import { PaymentStatus } from './dist/client/index.mjs'; if (!VERSION || PaymentStatus.SUCCESS !== 'success') process.exit(1)"
          # better-payment/testing must share classes with the main entry (instanceof checks)
          node -e "const { MockProvider } = require('better-payment/testing'); const { PaymentProvider } = require('better-payment'); if (!(new MockProvider() instanceof PaymentProvider)) process.exit(1)"
          node --input-type=module -e "import { MockProvider } from 'better-payment/testing'; import { PaymentProvider } from 'better-payment'; if (!(new MockProvider() instanceof PaymentProvider)) process.exit(1)"
          # better-payment/plugins: a plugin works with the main entry (shared classes)
          node -e "const { localizedErrors } = require('better-payment/plugins'); const bp = require('better-payment'); try { localizedErrors({ locale: 'xx' }); process.exit(1) } catch (e) { if (!(e instanceof bp.ConfigurationError)) process.exit(1) }"
          node --input-type=module -e "import { localizedErrors } from 'better-payment/plugins'; import { betterPayment } from 'better-payment'; const p = betterPayment({ providers: {}, plugins: [localizedErrors({ locale: 'tr' })] }); if (!p.errors.message('INSUFFICIENT_FUNDS').startsWith('Kart')) process.exit(1)"

      - name: Smoke test framework adapter subpaths (CJS and ESM)
        run: |
          # Resolve by package name so a missing exports mapping fails, even if dist exists.
          for entry in next:toNextJsHandler express:toExpressHandler hono:toHonoHandler fastify:toFastifyPlugin elysia:toElysiaHandler react-router:toReactRouterHandler; do
            adapter="${entry%%:*}"
            handler="${entry#*:}"
            node -e "const assert = require('node:assert/strict'); const path = 'better-payment/' + process.argv[1]; assert.equal(typeof require(path)[process.argv[2]], 'function', path + ' CJS handler export')" "$adapter" "$handler"
            node --input-type=module -e "import assert from 'node:assert/strict'; const path = 'better-payment/' + process.argv[1]; assert.equal(typeof (await import(path))[process.argv[2]], 'function', path + ' ESM handler export')" "$adapter" "$handler"
          done

      - name: Edge runtime smoke test (built bundle in the Vercel Edge VM)
        run: pnpm test:edge-smoke

      - name: No runtime dependencies
        run: node -e "const d = require('./package.json').dependencies || {}; if (Object.keys(d).length) { console.error('Runtime dependencies are not allowed:', d); process.exit(1) }"

      - name: Check package contents
        run: |
          test -f dist/index.js && test -f dist/index.mjs && test -f dist/index.d.ts
          test -f dist/client/index.js && test -f dist/client/index.d.ts
          test -f dist/testing/index.js && test -f dist/testing/index.mjs && test -f dist/testing/index.d.ts
          test -f dist/plugins/index.js && test -f dist/plugins/index.mjs && test -f dist/plugins/index.d.ts
          for adapter in next express hono fastify elysia react-router; do
            for extension in js mjs d.ts; do
              test -f "dist/$adapter/index.$extension"
            done
          done
          npm pack --dry-run
